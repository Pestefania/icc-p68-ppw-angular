<div class="max-w-md mx-auto bg-base-100 shadow-xl rounded-2xl p-6 border border-base-300 mt-10">
  @if (characterResource.isLoading()) {
    <div class="flex justify-center py-10">
      <span class="loading loading-spinner loading-lg text-primary"></span>
    </div>
  }

  @if (characterResource.hasValue()) {
    @let char = characterResource.value();
    <div class="flex flex-col items-center text-center">
      <img [src]="char?.portrait_path" [alt]="char?.name" class="w-32 h-32 rounded-full object-cover ring-4 ring-primary mb-4" />
      
      <h1 class="text-3xl font-bold text-base-content mb-1">{{ char?.name }}</h1>
      <p class="text-sm text-base-content/60 mb-4">{{ char?.occupation || 'Sin ocupación' }}</p>

      <button (click)="toggleFavorite()" class="btn btn-outline gap-2 mb-6" [class.btn-warning]="isFavorite()">
        ★ {{ isFavorite() ? 'Quitar de Favoritos' : 'Añadir a Favoritos' }}
      </button>

      <div class="w-full text-left bg-base-200 p-4 rounded-xl space-y-2 text-sm">
        <p><strong>Estado:</strong> {{ char?.status || 'Desconocido' }}</p>
        <p><strong>Género:</strong> {{ char?.gender || 'No especificado' }}</p>
      </div>

      <a routerLink="/simpsons" class="btn btn-ghost btn-sm mt-6">← Volver a la lista</a>
    </div>
  }
</div>
