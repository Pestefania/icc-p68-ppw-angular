<section class="flex min-h-[80vh] items-center justify-center p-4">
  <div class="card w-full max-w-sm border border-base-300 bg-base-100 shadow-sm rounded-2xl overflow-hidden">
    <div class="card-body gap-4 p-6">

      <h2 class="text-2xl font-black tracking-tight text-base-content">
        @if (isLogin()) { Iniciar sesión } @else { Crear cuenta } </h2>

      <form [formGroup]="authForm" (ngSubmit)='onSubmit()' class="space-y-4"> <div class="form-control">
          <label class="label" for="email">
            <span class="label-text font-medium">Correo electrónico</span> </label>
          <input
            id="email"
            type="email"
            formControlName="email" placeholder="usuario@ejemplo.com" class="input input-bordered w-full" [class.input-error]="authForm.get('email')?.invalid && authForm.get('email')?.touched" />
        </div>

        <div class="form-control">
          <label class="label" for="password">
            <span class="label-text font-medium">Contraseña</span> </label>
          <input
            id="password"
            type="password"
            formControlName="password" placeholder="••••••" class="input input-bordered w-full" [class.input-error]="authForm.get('password')?.invalid && authForm.get('password')?.touched" />
        </div>

        @if (errorMessage()) { <div class="alert alert-error py-2 px-3 text-sm rounded-xl">
            <span>{{ errorMessage() }}</span> </div>
        }

        <button
          type="submit"
          class="btn btn-primary w-full"
          [disabled]="authForm.invalid || isLoading()" >
          @if (isLoading()) { <span class="loading loading-spinner loading-sm"></span> } @else if (isLogin()) { Ingresar } @else {
            Registrarse }
        </button>
      </form>

      <p class="text-center text-sm text-base-content/60 mt-2">
        @if (isLogin()) { ¿No tienes cuenta?
          <button class="link link-primary font-semibold" (click)="toggleMode()">Regístrate aquí</button> } @else {
          ¿Ya tienes cuenta?
          <button class="link link-primary font-semibold" (click)="toggleMode()">Inicia sesión</button> }
      </p>

    </div>
  </div>
</section>
